name: ferme_track
description: "Application mobile de gestion de ferme avicole. Centralize all farm operations with real-time visibility."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Dependency Injection
  provider: ^6.0.0
  get_it: ^7.0.0
  
  # Local Storage & Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # API & Networking
  dio: ^5.4.0
  internet_connection_checker_plus: ^2.4.0
  
  # Synchronization & Offline Support
  # Note: Using Hive box 'sync_queue' for local implementation
  
  # Date & Time
  intl: ^0.20.2
  
  # Image & File Handling
  image_picker: ^1.0.0
  image: ^4.0.0
  
  # Authentication
  flutter_secure_storage: ^9.0.0
  
  # Notifications
  flutter_local_notifications: ^19.4.0
  
  # Logging & Debugging
  logger: ^2.0.0
  
  # Utilities
  equatable: ^2.0.5
  uuid: ^4.0.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
  
  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
